<style>
  section {
    display: flex;
    align-items: center;
    height: 100vh;
    justify-content: center;
    background-image: url(Ab.jpg.jpg);
    background-size: cover;
    background-position: center;
  }

  form {
    padding: 5% 10%;
    background: #6c696963;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    gap: 1rem;
    backdrop-filter: blur(3px);
  }

  h2 {
    color: white;
    text-align: center;
    font-size: 32px;
  }

  button {
    background: rgb(4, 70, 4);
    color: white;
    font-size: 22px;
    padding: 7%;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  button:hover {
    background: rgb(6, 116, 6)
  }

  input {
    padding: 7%;
    background: transparent;
    border: solid white 1px;
    color: white;
    outline: none;
    font-size: 18px;
  }

  input::placeholder {
    color: white;
  }

  a {
    text-decoration: none;
    color: rgb(0, 238, 255);
    text-align: center;
    font-size: 22px;

    &:hover {
      color: rgb(44, 173, 145);
    }
  }

  p {
    color: white;
    font-size: 19;
  }
</style>

<body>
  <section>
    <form action="">
      <h2>Sign In Page</h2>
      <div>
        <input type="email" placeholder="Email"><br>
      </div>

      <div>
        <input type="password" placeholder="Create password">
      </div>
      <p>Don't have an account? <a href="signup.html">Create</a><br></p>
      <button>SigIn</button>
    </form>
  </section>
</body>
